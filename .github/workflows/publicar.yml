# Arma el sitio con scripts/generar.js y lo publica en GitHub Pages:
# - en cada push a main;
# - cada 15 minutos, solo si el dueño cargó o cambió autos desde el panel (si no, no publica nada).
#   Ese chequeo también mantiene activo el proyecto de Supabase (el plan gratis lo pausa a los 7 días sin uso).
name: Publicar

on:
  push:
    branches: [main]
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  actions: write

# Sin cancelar: si no, un chequeo programado podría cortar la publicación de un push.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  generar:
    runs-on: ubuntu-latest
    outputs:
      cambio: ${{ steps.generar.outputs.cambio }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - id: generar
        run: node scripts/generar.js
        env:
          SOLO_SI_CAMBIO: ${{ github.event_name == 'schedule' && '1' || '' }}
      - if: steps.generar.outputs.cambio == 'true'
        uses: actions/configure-pages@v5
      - if: steps.generar.outputs.cambio == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      # GitHub apaga los workflows programados de repos públicos a los 60 días sin commits; esto lo mantiene vivo.
      - name: Mantener activa la publicación automática
        if: github.event_name == 'schedule'
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/publicar.yml/enable"
        env:
          GH_TOKEN: ${{ github.token }}

  publicar:
    needs: generar
    if: needs.generar.outputs.cambio == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
